name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
      # setup-gradle restores only an exact key, and its key is the hash of the build files,
      # so every change to them started from nothing. This cache falls back to the newest
      # entry by prefix, and Gradle rebuilds only what the change touched.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-jdk17-
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Install tools
        run: make install-tools
      - name: Build
        run: make build
      - name: Build the publication
        run: make publish-local
      # The daemon may still be writing to the cache, so it stops before the save.
      - name: Stop Gradle
        if: success() && github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop
      - name: Save the Gradle cache
        if: success() && github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
